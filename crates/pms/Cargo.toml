[package]
name = "pms"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
crossterm = "0.29.0"
dialoguer = "0.12.0"
dirs = "7.0.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
open = "5.4.4"
pms-client = { version = "0.7.0", path = "../pms-client" }
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom", "std"] }
tar = "0.4.46"
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots", "rustls-tls-native-roots"] }
toml = "1.1.8"
url = "2.5.8"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
serde_json = "1.0.152"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6.5"
